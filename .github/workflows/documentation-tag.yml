name: Documentation tag generation

on:
  push:
    tags:
      - 'docs-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing docs-v* tag to process
        required: true
        type: string

permissions:
  contents: read

jobs:
  discover:
    if: github.repository == 'zxbdzh/zxb-ai-agent'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      target_sha: ${{ steps.identity.outputs.target_sha }}
      previous_tag: ${{ steps.identity.outputs.previous_tag }}
      base_sha: ${{ steps.identity.outputs.base_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/master
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Resolve and validate immutable tag range
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_REF: ${{ github.ref }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="${PUSHED_REF#refs/tags/}"
          else
            tag="$REQUESTED_TAG"
          fi
          if [[ ! "$tag" =~ ^docs-v[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Tag must match docs-vMAJOR.MINOR.PATCH with an optional prerelease suffix." >&2
            exit 1
          fi
          git fetch --force --no-prune origin "refs/tags/$tag:refs/tags/$tag"
          target_sha="$(git rev-list -n 1 "$tag")"
          git fetch --no-tags origin refs/heads/master:refs/remotes/origin/master
          test "$target_sha" = "$(git rev-parse refs/remotes/origin/master)"
          duplicate_tag="$(git tag --points-at "$target_sha" --list 'docs-v*' | grep -Fxv "$tag" | head -n 1 || true)"
          if [[ -n "$duplicate_tag" ]]; then
            echo "Target SHA is already documented by $duplicate_tag." >&2
            exit 1
          fi
          previous_tag=""
          while IFS= read -r ancestor_sha; do
            candidate="$(git tag --points-at "$ancestor_sha" --list 'docs-v*' | sort -V | tail -n 1)"
            if [[ -n "$candidate" ]]; then
              previous_tag="$candidate"
              break
            fi
          done < <(git rev-list --first-parent "$target_sha^")
          if [[ -n "$previous_tag" ]]; then
            base_sha="$(git rev-list -n 1 "$previous_tag")"
            git merge-base --is-ancestor "$base_sha" "$target_sha"
          else
            base_sha="none"
            previous_tag="none"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

  verify:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/master
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.discover.outputs.target_sha }}
          path: tagged
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install trusted default-branch tooling
        working-directory: docs-site
        run: npm ci --ignore-scripts
      - name: Run fixed secret-free verification against tagged code
        working-directory: tagged
        run: |
          chmod +x ./gradlew
          ./gradlew styleCheck
          ./gradlew build -x test
      - name: Create target-SHA-bound evidence
        working-directory: docs-site
        env:
          TARGET_SHA: ${{ needs.discover.outputs.target_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node_modules/.bin/tsx scripts/create-verification-evidence.ts "$TARGET_SHA" "$RUN_URL" .tag-verification
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tag-verification-${{ needs.discover.outputs.target_sha }}
          if-no-files-found: error
          retention-days: 90
          path: docs-site/.tag-verification/verification-evidence.json

  generate:
    needs: [discover, verify]
    runs-on: ubuntu-latest
    environment: learning-checkpoint-generation
    concurrency:
      group: documentation-tag-generation-${{ needs.discover.outputs.tag }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/master
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install trusted default-branch tooling
        working-directory: docs-site
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tag-verification-${{ needs.discover.outputs.target_sha }}
          path: docs-site/.tag-verification
      - name: Generate bounded Wiki proposal without write credentials
        working-directory: docs-site
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
          TARGET_SHA: ${{ needs.discover.outputs.target_sha }}
          BASE_SHA: ${{ needs.discover.outputs.base_sha }}
          DOCS_TAG: ${{ needs.discover.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.discover.outputs.previous_tag }}
        run: |
          test -n "$OPENAI_BASE_URL"
          test -n "$OPENAI_MODEL"
          node_modules/.bin/tsx scripts/generate-tag-docs.ts --sha "$TARGET_SHA" --base-sha "$BASE_SHA" --tag "$DOCS_TAG" --previous-tag "$PREVIOUS_TAG" --evidence .tag-verification/verification-evidence.json --output .generated-tag
      - name: Revalidate every generated artifact
        working-directory: docs-site
        env:
          TARGET_SHA: ${{ needs.discover.outputs.target_sha }}
        run: node_modules/.bin/tsx scripts/validate-tag-staged-output.ts .generated-tag "$TARGET_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tag-proposal-${{ needs.discover.outputs.target_sha }}
          if-no-files-found: error
          retention-days: 30
          path: docs-site/.generated-tag/

  publish:
    needs: [discover, generate]
    runs-on: ubuntu-latest
    concurrency:
      group: documentation-tag-publication-${{ needs.discover.outputs.tag }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install trusted default-branch tooling
        working-directory: docs-site
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tag-proposal-${{ needs.discover.outputs.target_sha }}
          path: docs-site/.generated-tag
      - name: Reconfirm tag still points to current master
        env:
          DOCS_TAG: ${{ needs.discover.outputs.tag }}
          TARGET_SHA: ${{ needs.discover.outputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$DOCS_TAG:refs/tags/$DOCS_TAG"
          test "$(git rev-list -n 1 "$DOCS_TAG")" = "$TARGET_SHA"
          git fetch --no-tags origin refs/heads/master:refs/remotes/origin/master
          test "$TARGET_SHA" = "$(git rev-parse refs/remotes/origin/master)"
      - name: Apply bounded output and validate static documentation
        working-directory: docs-site
        env:
          TARGET_SHA: ${{ needs.discover.outputs.target_sha }}
        run: |
          node_modules/.bin/tsx scripts/validate-tag-staged-output.ts .generated-tag "$TARGET_SHA"
          node_modules/.bin/tsx scripts/publish-tag-staged-output.ts .generated-tag
          node_modules/.bin/tsx scripts/scan-sensitive-paths.ts .generated-tag src/content/docs/current src/content/docs/evolution public/evidence
          npm run check:markdown
          npm run check:current
          npm run check:evolution
          npm run astro:check
          npm run build
      - name: Create or update the deterministic documentation PR
        id: pull_request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_TAG: ${{ needs.discover.outputs.tag }}
          TARGET_SHA: ${{ needs.discover.outputs.target_sha }}
        run: |
          set -euo pipefail
          echo "terminal=false" >> "$GITHUB_OUTPUT"
          branch="docs/tag-$DOCS_TAG"
          pr_json="$(gh pr list --head "$branch" --state all --json number,state,mergedAt --limit 10)"
          if [[ "$(jq 'length' <<< "$pr_json")" -gt 1 ]]; then
            echo "Multiple lifetime PRs exist for $DOCS_TAG." >&2
            exit 1
          fi
          pr_number="$(jq -r '.[0].number // empty' <<< "$pr_json")"
          merged_at="$(jq -r '.[0].mergedAt // empty' <<< "$pr_json")"
          state="$(jq -r '.[0].state // empty' <<< "$pr_json")"
          if [[ -n "$merged_at" ]]; then
            echo "The documentation PR for $DOCS_TAG is already merged; rerun is terminal."
            echo "terminal=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -- docs-site/src/content/docs/current docs-site/src/content/docs/evolution docs-site/public/evidence
          if git diff --cached --quiet; then
            echo "No Wiki changes were produced for $DOCS_TAG." >&2
            exit 1
          fi
          git commit -m "docs(wiki): 自动更新 $DOCS_TAG"
          gh auth setup-git
          remote_sha="$(git ls-remote --heads origin "$branch" | cut -f1)"
          if [[ -n "$remote_sha" ]]; then
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "$branch"
          else
            git push origin "$branch"
          fi
          if [[ "$state" == "CLOSED" ]]; then
            gh pr reopen "$pr_number"
            gh pr edit "$pr_number" --body-file docs-site/.generated-tag/pr-body.md
          elif [[ "$state" == "OPEN" ]]; then
            gh pr edit "$pr_number" --body-file docs-site/.generated-tag/pr-body.md
          else
            pr_url="$(gh pr create --base master --head "$branch" --title "docs(wiki): 自动更新 $DOCS_TAG" --body-file docs-site/.generated-tag/pr-body.md)"
            pr_number="${pr_url##*/}"
          fi
          head_sha="$(git rev-parse HEAD)"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
      - name: Dispatch full documentation CI on the exact PR head
        if: steps.pull_request.outputs.terminal != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull_request.outputs.number }}
          BRANCH: ${{ steps.pull_request.outputs.branch }}
          HEAD_SHA: ${{ steps.pull_request.outputs.head_sha }}
          BASE_SHA: ${{ needs.discover.outputs.target_sha }}
        run: |
          gh workflow run docs-site.yml --ref "$BRANCH" \
            -f tag_docs_pr="$PR_NUMBER" \
            -f tag_docs_branch="$BRANCH" \
            -f tag_docs_head_sha="$HEAD_SHA" \
            -f tag_docs_base_sha="$BASE_SHA"
